openapi: 3.1.0
info:
  title: App Manager Platform API
  version: 1.0.0
  description: |
    Multi-tenant mobile app management platform API.

    Manage applications, builds, credentials, CI/CD pipelines, Expo integration, and outbound webhooks.
    All endpoints are scoped to a team via the `{team_slug}` path parameter.

    ## Authentication

    Every request requires a Bearer token (API key) tied to the team:

    ```
    Authorization: Bearer <api-key>
    Accept: application/json
    ```

    API keys are created in the team settings panel. The plaintext key is shown only once at creation time.

    ## Base URL

    ```
    http://localhost:8000/api/v1/{team_slug}
    ```
  contact:
    name: App Manager
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1/{team_slug}
    description: Local development
    variables:
      team_slug:
        default: demo-users-team
        description: Team slug

security:
  - bearerAuth: []

tags:
  - name: Mobile Apps
    description: CRUD operations on mobile applications
  - name: Assets
    description: Icon and splashscreen management
  - name: Files
    description: Arbitrary files attached to an application
  - name: Identifiers
    description: Platform identifiers (iOS bundle ID, Android package name, Web domain)
  - name: Credentials
    description: Signing credentials, certificates, and keystores
  - name: Credential Types
    description: Supported credential type metadata
  - name: Builds & Logs
    description: Build lifecycle and log streaming
  - name: Artifacts
    description: Build artifact files (IPA, APK, AAB)
  - name: CI/CD Pipelines
    description: Pipeline configurations for GitHub Actions and GitLab CI/CD
  - name: Integrations
    description: External integrations (GitHub, GitLab, Expo)
  - name: Expo Integration
    description: Expo EAS lifecycle — connect, sync, import, proxy
  - name: API Keys
    description: Team API key management
  - name: Webhooks
    description: Outbound webhook endpoints and delivery history

paths:
  /apps:
    get:
      operationId: listApps
      summary: List applications
      description: Returns a paginated list of all applications for the team.
      tags: [Mobile Apps]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MobileApp'
      security:
        - bearerAuth: [apps:read]

    post:
      operationId: createApp
      summary: Create application
      description: Create a new mobile application for the team.
      tags: [Mobile Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileApp'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileApp'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [apps:write]

  /apps/{app_slug}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: getApp
      summary: Get application
      description: Get details of a specific application.
      tags: [Mobile Apps]
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileApp'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [apps:read]

    patch:
      operationId: updateApp
      summary: Update application
      description: Update application fields. Pass `null` for `metadata` to clear it.
      tags: [Mobile Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobileApp'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileApp'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [apps:write]

    delete:
      operationId: deleteApp
      summary: Delete application
      description: Delete a mobile application and all its associated data.
      tags: [Mobile Apps]
      responses:
        '204':
          description: Application deleted
      security:
        - bearerAuth: [apps:write]

  /apps/{app_slug}/assets:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: getAssets
      summary: Get asset URLs
      description: |
        Returns a flat JSON map of available asset files and their download URLs.
        Only uploaded originals and ready conversions are included.
      tags: [Assets]
      responses:
        '200':
          description: Asset URL map
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: string
                    example:
                      icon.original: http://localhost:8000/api/v1/acme/apps/customer-app/assets/icon/files/original
                      icon.ios-icon-40: http://localhost:8000/api/v1/acme/apps/customer-app/assets/icon/files/ios-icon-40
      security:
        - bearerAuth: [assets:read]

  /apps/{app_slug}/assets/{asset}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/AssetType'

    get:
      operationId: getAsset
      summary: Get asset metadata
      description: Get metadata for an asset (icon or splashscreen).
      tags: [Assets]
      responses:
        '200':
          description: Asset metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssetMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [assets:read]

    post:
      operationId: uploadAsset
      summary: Upload or replace asset
      description: |
        Upload a new icon or splashscreen, replacing the current one. `PUT` is accepted as an
        alias on the same path, but `POST` is documented here and recommended because not every
        PHP SAPI parses a multipart body for `PUT`.

        The file must be an image, max 10 MB. Per-platform variants are generated afterwards, so
        a variant listing can briefly show fewer entries than it will a moment later.
      tags: [Assets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (max 10 MB)
      responses:
        '200':
          description: Asset uploaded, returns updated application
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileApp'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [assets:write]

    delete:
      operationId: deleteAsset
      summary: Delete asset
      description: |
        Remove the icon or splashscreen and every generated variant. Deleting an icon
        triggers an Expo sync when the application is linked to an Expo project.
      tags: [Assets]
      responses:
        '204':
          description: Asset deleted
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [assets:write]

  /apps/{app_slug}/assets/{asset}/files/{file}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/AssetType'
      - name: file
        in: path
        required: true
        schema:
          type: string
        description: File conversion name (e.g. `original`, `ios-icon-40`)

    get:
      operationId: downloadAssetFile
      summary: Download asset file
      description: Download an asset file as attachment.
      tags: [Assets]
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [assets:read]

  /apps/{app_slug}/files:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: listAppFiles
      summary: List app files
      description: Returns a paginated list of files attached to the application, newest first.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AppFile'
      security:
        - bearerAuth: [files:read]

    post:
      operationId: uploadAppFile
      summary: Upload app file
      description: |
        Attach a file to the application. File names are unique per application:
        uploading a name that already exists returns `422`. Delete the existing file first to replace it.
        The maximum size is the instance's `MEDIA_MAX_FILE_SIZE_KB` (100 MB by default).
      tags: [Files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File to attach
                metadata:
                  type: string
                  description: JSON object (or form-encoded object) with arbitrary metadata
      responses:
        '201':
          description: File attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppFile'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [files:write]

  /apps/{app_slug}/files/{file}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/AppFileName'

    get:
      operationId: getAppFile
      summary: Get app file metadata
      tags: [Files]
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppFile'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [files:read]

    patch:
      operationId: updateAppFile
      summary: Update app file metadata
      description: Replaces the file's metadata object. Send `null` to clear it.
      tags: [Files]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: true
      responses:
        '200':
          description: Metadata updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppFile'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [files:write]

    delete:
      operationId: deleteAppFile
      summary: Delete app file
      tags: [Files]
      responses:
        '204':
          description: File deleted
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [files:write]

  /apps/{app_slug}/files/{file}/content:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/AppFileName'

    get:
      operationId: downloadAppFile
      summary: Download app file
      description: Streams the file as an attachment.
      tags: [Files]
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [files:read]

  /apps/{app_slug}/identifiers:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: listIdentifiers
      summary: List identifiers
      description: Returns a paginated list of platform identifiers for the application.
      tags: [Identifiers]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of identifiers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AppIdentifier'
      security:
        - bearerAuth: [identifiers:read]

    post:
      operationId: createIdentifier
      summary: Create identifier
      description: |
        Create a new platform identifier for the application.
        For Web, the identifier must be a valid domain (no scheme, port, or path). It is normalized to lowercase.
        `version_code` is only available for Android.
      tags: [Identifiers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppIdentifier'
      responses:
        '201':
          description: Identifier created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppIdentifier'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [identifiers:write]

  /apps/{app_slug}/identifiers/{identifier}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/IdentifierId'

    get:
      operationId: getIdentifier
      summary: Get identifier
      tags: [Identifiers]
      responses:
        '200':
          description: Identifier details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppIdentifier'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [identifiers:read]

    patch:
      operationId: updateIdentifier
      summary: Update identifier
      description: |
        Update platform identifier fields. If changing platform, `identifier` becomes required.
        Cannot change platform to `web` if the identifier has attached credentials or profiles.
      tags: [Identifiers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppIdentifier'
      responses:
        '200':
          description: Identifier updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppIdentifier'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [identifiers:write]

    delete:
      operationId: deleteIdentifier
      summary: Delete identifier
      tags: [Identifiers]
      responses:
        '204':
          description: Identifier deleted
      security:
        - bearerAuth: [identifiers:write]

  /apps/{app_slug}/credentials:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: listCredentials
      summary: List credentials
      description: Returns a paginated list of signing credentials for the application.
      tags: [Credentials]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of credentials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Credential'
      security:
        - bearerAuth: [credentials:read]

    post:
      operationId: createCredential
      summary: Create credential
      description: |
        Create a signing credential and attach it to an identifier.
        Profile-scoped types (`ios_certificate`, `provisioning_profile`, `android_keystore`) require `profile_type`.
        Service credential types attach directly to the identifier and do not accept `profile_type`.
        Payload fields are encrypted at rest.
      tags: [Credentials]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCredential'
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [credentials:write]

  /apps/{app_slug}/credentials/{credential}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/CredentialId'

    get:
      operationId: getCredential
      summary: Get credential
      tags: [Credentials]
      responses:
        '200':
          description: Credential details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [credentials:read]

    patch:
      operationId: updateCredential
      summary: Update credential
      description: |
        Update credential name, expires_at, payload, or file. Type and profile_type are immutable — recreate the credential to change them.
      tags: [Credentials]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateCredential'
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [credentials:write]

    delete:
      operationId: deleteCredential
      summary: Delete credential
      tags: [Credentials]
      responses:
        '204':
          description: Credential deleted
      security:
        - bearerAuth: [credentials:write]

  /apps/{app_slug}/credentials/{credential}/file:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/CredentialId'

    get:
      operationId: downloadCredentialFile
      summary: Download credential file
      tags: [Credentials]
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [credentials:read]

    post:
      operationId: uploadCredentialFile
      summary: Upload or replace credential file
      description: Upload a new file for the credential (max 20 MB).
      tags: [Credentials]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [credentials:write]

    delete:
      operationId: deleteCredentialFile
      summary: Delete credential file
      tags: [Credentials]
      responses:
        '204':
          description: File deleted
      security:
        - bearerAuth: [credentials:write]

  /credential-types:
    get:
      operationId: listCredentialTypes
      summary: List credential types
      description: |
        Returns all supported credential types with their platforms, allowed extensions,
        required payload fields, attachment binding, and available build profiles.
      tags: [Credential Types]
      responses:
        '200':
          description: List of credential types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialTypeMetadata'
      security:
        - bearerAuth: [credentials:read]

  /apps/{app_slug}/builds:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: listBuilds
      summary: List builds
      description: Returns a paginated list of recent builds for the application.
      tags: [Builds & Logs]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of builds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BuildRecord'
      security:
        - bearerAuth: [builds:read]

    post:
      operationId: createBuild
      summary: Create build
      description: |
        Create a manual build in `pending` status.
        Creation is idempotent per team + `request_uuid` pair.
        `parameters` is an arbitrary JSON object up to 64 KB.
      tags: [Builds & Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuild'
      responses:
        '201':
          description: Build created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BuildRecord'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [builds:write]

  /apps/{app_slug}/builds/{build}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'

    get:
      operationId: getBuild
      summary: Get build
      tags: [Builds & Logs]
      responses:
        '200':
          description: Build details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BuildRecord'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [builds:read]

    patch:
      operationId: updateBuild
      summary: Update build status
      description: |
        Update build status. Only allowed for manual builds.
        Automatic builds return 409 for manual status writes.
        Terminal transitions (to completed/failed/cancelled) on already-finished builds return 409.
      tags: [Builds & Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuild'
      responses:
        '200':
          description: Build updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BuildRecord'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [builds:write]

  /apps/{app_slug}/builds/{build}/logs:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'

    get:
      operationId: getBuildLogs
      summary: Read build logs
      description: |
        Read the full build log. Supports byte-range pagination via `offset` and `limit` query parameters.
        Without offset/limit, returns the complete log content.
      tags: [Builds & Logs]
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Byte offset to start from
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Maximum bytes to return
      responses:
        '200':
          description: Build logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLog'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [logs:read]

    post:
      operationId: appendBuildLogs
      summary: Append build log
      description: "Append a plain-text chunk to the build log. Max chunk size: 256 KiB, total log: 5 MiB."
      tags: [Builds & Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Plain-text log content to append
      responses:
        '200':
          description: Log appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLogAppendResponse'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: [logs:write]

  /apps/{app_slug}/builds/{build}/cancel:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'

    post:
      operationId: cancelBuild
      summary: Request build cancellation
      description: |
        Request cancellation of a build. Transitions manual builds to `cancel_requested`.
        The runner then confirms `cancelled` or reports the actual status.
      tags: [Builds & Logs]
      responses:
        '202':
          description: Cancellation requested
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: [pipelines:run]

  /apps/{app_slug}/builds/{build}/artifacts:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'

    get:
      operationId: listArtifacts
      summary: List build artifacts
      tags: [Artifacts]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of artifacts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Artifact'
      security:
        - bearerAuth: [artifacts:read]

    post:
      operationId: uploadArtifact
      summary: Upload build artifact
      description: Upload a build artifact file (max 500 MB).
      tags: [Artifacts]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Artifact name
                file:
                  type: string
                  format: binary
                  description: Artifact file (max 500 MB)
                metadata:
                  type: string
                  description: JSON string or object with arbitrary metadata
      responses:
        '201':
          description: Artifact uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Artifact'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [artifacts:write]

  /apps/{app_slug}/builds/{build}/artifacts/{artifact}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'
      - $ref: '#/components/parameters/ArtifactId'

    get:
      operationId: getArtifact
      summary: Get artifact details
      tags: [Artifacts]
      responses:
        '200':
          description: Artifact details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Artifact'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [artifacts:read]

    delete:
      operationId: deleteArtifact
      summary: Delete artifact
      tags: [Artifacts]
      responses:
        '204':
          description: Artifact deleted
      security:
        - bearerAuth: [artifacts:write]

  /apps/{app_slug}/builds/{build}/artifacts/{artifact}/file:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'
      - $ref: '#/components/parameters/ArtifactId'

    get:
      operationId: downloadArtifact
      summary: Download artifact file
      tags: [Artifacts]
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [artifacts:read]

  /integrations:
    get:
      operationId: listIntegrations
      summary: List integrations
      description: Returns all integrations for the team.
      tags: [Integrations]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of integrations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Integration'
      security:
        - bearerAuth: [integrations:read]

  /integrations/{integration}:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    get:
      operationId: getIntegration
      summary: Get integration
      tags: [Integrations]
      responses:
        '200':
          description: Integration details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [integrations:read]

  /integrations/expo:
    post:
      operationId: connectExpo
      summary: Connect Expo account
      description: |
        Connect an Expo account or replace the token of an existing connection.
        If the token grants access to multiple Expo accounts, provide `account_name`.
        Returns 201 for new connections, 200 for reconnects.
        If the account connects but the initial inventory sync fails, the integration is saved in `degraded` state.
      tags: [Expo Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token:
                  type: string
                  maxLength: 10000
                  description: Expo access token
                account_name:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: Expo account name (required if token grants access to multiple accounts)
      responses:
        '201':
          description: Expo account connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
                  meta:
                    type: object
                    properties:
                      projects_count:
                        type: integer
                      sync_error:
                        type: string
                        nullable: true
        '200':
          description: Token replaced for existing connection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
                  meta:
                    type: object
                    properties:
                      projects_count:
                        type: integer
                      sync_error:
                        type: string
                        nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [integrations:write]

  /integrations/{integration}/expo/sync:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    post:
      operationId: syncExpo
      summary: Sync Expo account
      description: Refresh account metadata and project inventory from Expo.
      tags: [Expo Integration]
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
                  meta:
                    type: object
                    properties:
                      projects_count:
                        type: integer
      security:
        - bearerAuth: [integrations:write]

  /integrations/{integration}/expo/projects:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    get:
      operationId: listExpoProjects
      summary: List Expo projects
      description: Get synchronized Expo projects.
      tags: [Expo Integration]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of Expo projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpoProject'
      security:
        - bearerAuth: [integrations:read]

  /integrations/{integration}/expo:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    delete:
      operationId: disconnectExpo
      summary: Disconnect Expo account
      description: Disconnect the Expo account while preserving project links and remote history.
      tags: [Expo Integration]
      responses:
        '204':
          description: Account disconnected
      security:
        - bearerAuth: [integrations:write]

  /integrations/{integration}/expo/projects/{project_id}/import:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Expo project ID

    post:
      operationId: importExpoProject
      summary: Import Expo project
      description: Import an Expo project as a new application with identifiers and EAS credentials.
      tags: [Expo Integration]
      responses:
        '201':
          description: Project imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileApp'
                  meta:
                    type: object
                    properties:
                      identifiers_imported:
                        type: integer
                      credentials_imported:
                        type: integer
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [integrations:write, apps:write, credentials:write]

  /integrations/{integration}/repositories:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    get:
      operationId: listIntegrationRepositories
      summary: List integration repositories
      description: Discover repositories available through this integration.
      tags: [Integrations]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of repositories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            full_name:
                              type: string
                            name:
                              type: string
      security:
        - bearerAuth: [integrations:read]

  /integrations/{integration}/workflows:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    get:
      operationId: listIntegrationWorkflows
      summary: List integration workflows
      description: Discover CI/CD workflows available in the repository.
      tags: [Integrations]
      parameters:
        - name: repository_full_name
          in: query
          required: true
          schema:
            type: string
          description: Repository full name (e.g. `owner/repo`)
        - name: ref
          in: query
          schema:
            type: string
            default: main
          description: Git ref to query
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        path:
                          type: string
      security:
        - bearerAuth: [integrations:read]

  /integrations/{integration}/refs:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    get:
      operationId: listIntegrationRefs
      summary: List git refs
      description: Discover available git refs (branches, tags) for a repository.
      tags: [Integrations]
      parameters:
        - name: repository_full_name
          in: query
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search query to filter refs
      responses:
        '200':
          description: List of refs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        ref:
                          type: string
      security:
        - bearerAuth: [integrations:read]

  /integrations/{integration}/pipelines:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    get:
      operationId: listPipelines
      summary: List CI/CD pipelines
      tags: [CI/CD Pipelines]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of pipelines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CiCdPipeline'
      security:
        - bearerAuth: [pipelines:read]

    post:
      operationId: createPipeline
      summary: Create pipeline
      description: Create a new CI/CD pipeline configuration.
      tags: [CI/CD Pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCiCdPipeline'
      responses:
        '201':
          description: Pipeline created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CiCdPipeline'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [pipelines:write]

  /integrations/{integration}/pipelines/{pipeline}:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - $ref: '#/components/parameters/PipelineId'

    get:
      operationId: getPipeline
      summary: Get pipeline
      tags: [CI/CD Pipelines]
      responses:
        '200':
          description: Pipeline details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CiCdPipeline'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [pipelines:read]

    patch:
      operationId: updatePipeline
      summary: Update pipeline
      tags: [CI/CD Pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCiCdPipeline'
      responses:
        '200':
          description: Pipeline updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CiCdPipeline'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [pipelines:write]

    delete:
      operationId: deletePipeline
      summary: Delete pipeline
      tags: [CI/CD Pipelines]
      responses:
        '204':
          description: Pipeline deleted
      security:
        - bearerAuth: [pipelines:write]

  /integrations/{integration}/pipelines/{pipeline}/inputs:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - $ref: '#/components/parameters/PipelineId'

    get:
      operationId: getPipelineInputs
      summary: Get pipeline workflow inputs
      description: |
        Returns the inputs defined in the remote CI/CD workflow configuration.
        Used to populate the pipeline input form.
      tags: [CI/CD Pipelines]
      responses:
        '200':
          description: Workflow inputs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowInput'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [pipelines:read]

  /integrations/{integration}/pipelines/{pipeline}/runs:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - $ref: '#/components/parameters/PipelineId'

    post:
      operationId: dispatchPipeline
      summary: Dispatch pipeline run
      description: |
        Dispatch a CI/CD pipeline run. Creates a build record and triggers the remote workflow.
        `ref` overrides the pipeline default git ref. `inputs` are passed to the workflow.
      tags: [CI/CD Pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_uuid]
              properties:
                request_uuid:
                  type: string
                  format: uuid
                  description: Idempotency key
                ref:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: Git ref override
                inputs:
                  type: object
                  maxProperties: 25
                  additionalProperties:
                    type: string
                  description: Workflow input key-value pairs
      responses:
        '201':
          description: Pipeline dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BuildRecord'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [pipelines:run]

  /apps/{app_slug}/builds/{build_id}/logs/archive:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'

    get:
      operationId: downloadBuildLogArchive
      summary: Download the archived build log
      description: |
        Download the archived log for a build whose live log has been truncated. Long logs
        are archived once they pass the retained size, and the archive stays available after
        the live log no longer holds the full output.
      tags: [Logs]
      responses:
        '200':
          description: Archived log
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: This build has no archived log
      security:
        - bearerAuth: [logs:read]

  /apps/{app_slug}/builds/{build_id}/sync-eas:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/BuildId'

    post:
      operationId: syncEasBuildStatus
      summary: Sync an EAS build's status from Expo
      description: |
        Pull the current status of a build reported by Expo. Only builds in the `eas`
        reporting mode can be synced; manual and provider-reported builds answer `409`,
        because their status belongs to whoever reports them.
      tags: [Builds]
      responses:
        '200':
          description: Build record after the sync
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BuildRecord'
        '409':
          description: The build does not report through Expo
        '502':
          description: Expo could not be reached
      security:
        - bearerAuth: [builds:write]

  /apps/{app_slug}/credentials/{credential_id}/reveal:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/CredentialId'

    post:
      operationId: revealCredential
      summary: Reveal a credential's secure fields
      description: |
        Return the decrypted payload of a credential. This is an access event: it is written
        to the audit log with the actor that performed it. Responses are sent with
        `Cache-Control: no-store`, and the endpoint is rate limited to 30 requests per
        minute.

        Requires the `credentials:reveal` scope, which is deliberately separate from
        `credentials:read` — listing that a credential exists and reading its secrets are
        different acts.
      tags: [Credentials]
      responses:
        '200':
          description: Decrypted payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      payload:
                        type: object
                        description: Secure fields, decrypted
                        additionalProperties: true
        '403':
          description: Missing the credentials:reveal scope or the manage_credentials permission
        '429':
          description: Rate limit exceeded
      security:
        - bearerAuth: [credentials:reveal]

  /apps/{app_slug}/credentials/{credential_id}/verification:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - $ref: '#/components/parameters/CredentialId'

    post:
      operationId: recordCredentialVerification
      summary: Record a verification result for an external credential
      description: |
        Report whether an externally stored credential reference resolves. Pipelines that
        resolve secrets from an external vault use this to record the outcome, so a broken
        reference is visible before a release rather than during one.

        `error` is required when the status is `failed` and rejected when it is `verified`.
        `expires_at` is rejected for a failed verification, since a reference that did not
        resolve has no expiry to report.
      tags: [Credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [verified, failed]
                error:
                  type: string
                  maxLength: 1000
                  description: Required when status is `failed`
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Rejected when status is `failed`
                metadata:
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                    maxLength: 500
      responses:
        '200':
          description: Verification recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      provider:
                        type: string
                      resource:
                        type: string
                      metadata:
                        type: object
                        additionalProperties: true
                      metadata_version:
                        type: integer
                      metadata_source:
                        type: string
                      verification:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [verified, failed]
                          verified_at:
                            type: string
                            format: date-time
                            nullable: true
                          error:
                            type: string
                            nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [credentials:verify]

  /apps/{app_slug}/expo/automatic-sync:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    patch:
      operationId: updateExpoAutomaticSync
      summary: Enable or disable automatic Expo sync
      description: |
        Turn automatic sync on or off for the linked Expo project. Enabling is refused with
        `422` when the project no longer exists on Expo or the account's token is broken,
        rather than accepting a setting that cannot work.
      tags: [Expo Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Automatic sync state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      automatic_sync:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          status:
                            type: string
                          error:
                            type: string
                            nullable: true
                          last_pushed_at:
                            type: string
                            format: date-time
                            nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [apps:write, credentials:write, integrations:write]

  /apps/{app_slug}/expo:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: getExpoProject
      summary: Get Expo project link
      description: |
        Get the Expo project link and live metadata, builds, and submissions.
        Use `build_limit`, `build_offset`, `submission_limit`, `submission_offset` query params to paginate nested resources.
      tags: [Expo Integration]
      parameters:
        - name: build_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: build_offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: submission_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: submission_offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Expo project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/ExpoProject'
                      remote:
                        type: object
                        description: Raw Expo API response
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [apps:read, integrations:read]

    post:
      operationId: linkExpoProject
      summary: Link or create Expo project
      description: |
        Create a new Expo project or link an existing one.
        `mode: create` — creates a new remote project.
        `mode: existing` — links to an existing project by `expo_project_id`.
      tags: [Expo Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkExpoProject'
      responses:
        '201':
          description: Project created on Expo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExpoProject'
                  meta:
                    type: object
                    properties:
                      created_on_expo:
                        type: boolean
                      identifiers_pushed:
                        type: integer
                      credentials_pushed:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string
        '200':
          description: Linked to existing project
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExpoProject'
                  meta:
                    type: object
                    properties:
                      created_on_expo:
                        type: boolean
                      identifiers_pushed:
                        type: integer
                      credentials_pushed:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [apps:write, credentials:write, integrations:write]

    delete:
      operationId: unlinkExpoProject
      summary: Unlink Expo project
      description: Remove the local Expo project link without deleting the remote project.
      tags: [Expo Integration]
      responses:
        '204':
          description: Project unlinked
      security:
        - bearerAuth: [apps:write, integrations:write]

  /apps/{app_slug}/expo/sync:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    post:
      operationId: syncExpoProject
      summary: Sync Expo project
      description: |
        Synchronize metadata, identifiers, and EAS credentials with Expo.
        Returns the updated app and project data along with sync counts.
      tags: [Expo Integration]
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app:
                        $ref: '#/components/schemas/MobileApp'
                      project:
                        $ref: '#/components/schemas/ExpoProject'
                  meta:
                    type: object
                    properties:
                      identifiers_synced:
                        type: integer
                      credentials_synced:
                        type: integer
      security:
        - bearerAuth: [apps:write, credentials:write, integrations:write]

  /apps/{app_slug}/expo/identifiers:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    get:
      operationId: listExpoIdentifiers
      summary: Compare Expo identifiers
      description: Compare identifiers between App Manager and Expo.
      tags: [Expo Integration]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Identifier comparison
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
      security:
        - bearerAuth: [identifiers:read, integrations:read]

  /apps/{app_slug}/expo/identifiers/sync:
    parameters:
      - $ref: '#/components/parameters/AppSlug'

    post:
      operationId: syncExpoIdentifiers
      summary: Sync Expo identifiers
      description: |
        Push local iOS and Android identifiers to Expo and report what changed. Web
        identifiers are ignored, since they have no meaning on Expo.
      tags: [Expo Integration]
      responses:
        '200':
          description: Identifiers synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer
                      unchanged:
                        type: integer
        '404':
          description: The application has no linked Expo project
        '502':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [identifiers:write, integrations:write]

  /apps/{app_slug}/expo/identifiers/{identifier_id}/provision:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - name: identifier_id
        in: path
        required: true
        schema:
          type: string
        description: App identifier ID

    post:
      operationId: provisionExpoIdentifier
      summary: Provision Expo identifier
      description: |
        Create a remote Expo identifier and provision the selected credentials.
        Without `credential_ids`, sends all supported credentials with uploaded files.
        With `credential_ids`, sends only the specified credentials (each must be attached to the identifier).
      tags: [Expo Integration]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Specific credential IDs to provision (optional)
      responses:
        '200':
          description: Identifier provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpoCredentialLink'
                  meta:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [identifiers:write, credentials:write, integrations:write]

  /apps/{app_slug}/expo/identifiers/{identifier_id}/credentials/{credential_id}:
    parameters:
      - $ref: '#/components/parameters/AppSlug'
      - name: identifier_id
        in: path
        required: true
        schema:
          type: string
      - name: credential_id
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: pushExpoCredential
      summary: Push Expo credential
      description: |
        Push or re-sync a single credential to Expo.
        Remote credential resources are immutable — a repeated push creates a new resource and updates the local link.
      tags: [Expo Integration]
      responses:
        '200':
          description: Credential pushed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExpoCredentialLink'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [credentials:write, integrations:write]

  /integrations/{integration}/expo/graphql:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'

    post:
      operationId: expoGraphQLProxy
      summary: Expo GraphQL proxy
      description: |
        Forward a GraphQL request to Expo's API.
        The `Authorization` header is replaced with the saved Expo token.
        Always requires `integrations:proxy` scope, even for queries — a single GraphQL document can contain multiple operations.
      tags: [Expo Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: GraphQL query document
                variables:
                  type: object
                  description: Query variables
                operation_name:
                  type: string
                  description: Operation name to execute
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
        '502':
          description: Expo upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpoUpstreamError'
        '503':
          description: Expo unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpoUpstreamError'
      security:
        - bearerAuth: [integrations:proxy]

  /integrations/{integration}/expo/proxy/{expo_api_path}:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
      - name: expo_api_path
        in: path
        required: true
        schema:
          type: string
        description: Expo API path to proxy

    get:
      operationId: expoRestProxyGet
      summary: Expo REST proxy (GET)
      description: |
        Forward a GET request to Expo's REST API. The `Authorization` header is replaced with the saved Expo token.
        Preserves upstream status, body, and safe response headers.
      tags: [Expo Integration]
      responses:
        '200':
          description: Upstream response
        '502':
          description: Expo upstream error
        '503':
          description: Expo unavailable
      security:
        - bearerAuth: [integrations:proxy]

    post:
      operationId: expoRestProxyPost
      summary: Expo REST proxy (POST)
      tags: [Expo Integration]
      responses:
        '200':
          description: Upstream response
        '502':
          description: Expo upstream error
        '503':
          description: Expo unavailable
      security:
        - bearerAuth: [integrations:proxy]

    put:
      operationId: expoRestProxyPut
      summary: Expo REST proxy (PUT)
      tags: [Expo Integration]
      responses:
        '200':
          description: Upstream response
        '502':
          description: Expo upstream error
        '503':
          description: Expo unavailable
      security:
        - bearerAuth: [integrations:proxy]

    patch:
      operationId: expoRestProxyPatch
      summary: Expo REST proxy (PATCH)
      tags: [Expo Integration]
      responses:
        '200':
          description: Upstream response
        '502':
          description: Expo upstream error
        '503':
          description: Expo unavailable
      security:
        - bearerAuth: [integrations:proxy]

    delete:
      operationId: expoRestProxyDelete
      summary: Expo REST proxy (DELETE)
      tags: [Expo Integration]
      responses:
        '200':
          description: Upstream response
        '502':
          description: Expo upstream error
        '503':
          description: Expo unavailable
      security:
        - bearerAuth: [integrations:proxy]

  /webhooks:
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of webhook endpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookEndpoint'
      security:
        - bearerAuth: [webhooks:read]

    post:
      operationId: createWebhookEndpoint
      summary: Create webhook endpoint
      description: |
        Create a webhook endpoint. The `secret` is returned only in this response — save it immediately.
        Subscribable events exclude `webhook.test`.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookEndpoint'
      responses:
        '201':
          description: Webhook endpoint created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        properties:
                          secret:
                            type: string
                            description: Signing secret (shown only once)
                            example: whsec_abc123...
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [webhooks:write]

  /webhooks/{webhookEndpoint}:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'

    get:
      operationId: getWebhookEndpoint
      summary: Get webhook endpoint
      description: Get webhook endpoint details without the secret.
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook endpoint details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [webhooks:read]

    patch:
      operationId: updateWebhookEndpoint
      summary: Update webhook endpoint
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookEndpoint'
      responses:
        '200':
          description: Webhook endpoint updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpoint'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [webhooks:write]

    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete webhook endpoint
      tags: [Webhooks]
      responses:
        '204':
          description: Endpoint deleted
      security:
        - bearerAuth: [webhooks:write]

  /webhooks/{webhookEndpoint}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'

    post:
      operationId: rotateWebhookSecret
      summary: Rotate webhook secret
      description: Immediately replace the signing secret. The new secret is returned in the response.
      tags: [Webhooks]
      responses:
        '200':
          description: Secret rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookEndpoint'
                      - type: object
                        properties:
                          secret:
                            type: string
                            description: New signing secret (shown only once)
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [webhooks:write]

  /webhooks/{webhookEndpoint}/test:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'

    post:
      operationId: testWebhookEndpoint
      summary: Test webhook endpoint
      description: |
        Queue a test webhook delivery. The test is always sent to the endpoint regardless of subscriptions and filters.
      tags: [Webhooks]
      responses:
        '202':
          description: Test delivery queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [queued]
      security:
        - bearerAuth: [webhooks:write]

  /webhooks/{webhookEndpoint}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'

    get:
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: Returns a cursor-paginated list of webhook deliveries.
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated list of deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookDelivery'
      security:
        - bearerAuth: [deliveries:read]

  /webhooks/{webhookEndpoint}/deliveries/{delivery}:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
      - $ref: '#/components/parameters/DeliveryId'

    get:
      operationId: getWebhookDelivery
      summary: Get webhook delivery
      tags: [Webhooks]
      responses:
        '200':
          description: Delivery details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [deliveries:read]

  /webhooks/{webhookEndpoint}/deliveries/{delivery}/redeliver:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
      - $ref: '#/components/parameters/DeliveryId'

    post:
      operationId: redeliverWebhook
      summary: Redeliver webhook
      description: Create a manual redelivery. Gets a new delivery ID linked to the original via `redelivery_of_id`.
      tags: [Webhooks]
      responses:
        '201':
          description: Redelivery created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [webhooks:write]

  /api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: Returns all API keys for the team.
      tags: [API Keys]
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of API keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKey'
      security:
        - bearerAuth: [api-keys:read]

    post:
      operationId: createApiKey
      summary: Create API key
      description: |
        Create a new API key. Only the team owner can create keys.
        The plaintext token is returned only in this response.
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Key name
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - apps:read
                      - apps:write
                      - identifiers:read
                      - identifiers:write
                      - assets:read
                      - assets:write
                      - files:read
                      - files:write
                      - credentials:read
                      - credentials:write
                      - builds:read
                      - builds:write
                      - logs:read
                      - logs:write
                      - artifacts:read
                      - artifacts:write
                      - integrations:read
                      - integrations:write
                      - integrations:proxy
                      - pipelines:read
                      - pipelines:write
                      - pipelines:run
                      - webhooks:read
                      - webhooks:write
                      - deliveries:read
                      - api-keys:read
                      - api-keys:write
                  uniqueItems: true
                  description: Key scopes
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
                      token:
                        type: string
                        description: Plain-text API key (shown only once)
                      created_at:
                        type: string
                        format: date-time
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: [api-keys:write]

  /api-keys/{apiKey}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'

    get:
      operationId: getApiKey
      summary: Get API key
      tags: [API Keys]
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: [api-keys:read]

    delete:
      operationId: revokeApiKey
      summary: Revoke API key
      tags: [API Keys]
      responses:
        '204':
          description: API key revoked
      security:
        - bearerAuth: [api-keys:write]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key (plain text) passed as Bearer token

  parameters:
    TeamSlug:
      name: team_slug
      in: path
      required: true
      schema:
        type: string
      description: Team URL slug
    AppSlug:
      name: app_slug
      in: path
      required: true
      schema:
        type: string
      description: Application slug
    AppFileName:
      name: file
      in: path
      required: true
      schema:
        type: string
      description: File name as stored by the media library (e.g. `release-notes.pdf`)
    AssetType:
      name: asset
      in: path
      required: true
      schema:
        type: string
        enum: [icon, splashscreen]
      description: Asset type
    IdentifierId:
      name: identifier
      in: path
      required: true
      schema:
        type: string
      description: Identifier ID
    CredentialId:
      name: credential
      in: path
      required: true
      schema:
        type: string
      description: Credential ID
    BuildId:
      name: build
      in: path
      required: true
      schema:
        type: string
      description: Build record ID
    ArtifactId:
      name: artifact
      in: path
      required: true
      schema:
        type: string
      description: Artifact ID
    IntegrationId:
      name: integration
      in: path
      required: true
      schema:
        type: string
      description: Integration ID
    PipelineId:
      name: pipeline
      in: path
      required: true
      schema:
        type: string
      description: CI/CD pipeline ID
    WebhookEndpointId:
      name: webhookEndpoint
      in: path
      required: true
      schema:
        type: string
      description: Webhook endpoint ID
    DeliveryId:
      name: delivery
      in: path
      required: true
      schema:
        type: string
      description: Webhook delivery ID
    ApiKeyId:
      name: apiKey
      in: path
      required: true
      schema:
        type: string
      description: API key ID
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Items per page
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number

  schemas:
    MobileApp:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
          default: []
        description:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        assets:
          type: object
          properties:
            icon:
              $ref: '#/components/schemas/AppAsset'
            splashscreen:
              $ref: '#/components/schemas/AppAsset'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AppAsset:
      type: object
      nullable: true
      properties:
        name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        url:
          type: string

    CreateMobileApp:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-zA-Z0-9]+(?:[._-][a-zA-Z0-9]+)*$'
          description: Auto-generated from name if omitted
        description:
          type: string
          maxLength: 2000
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    UpdateMobileApp:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-zA-Z0-9]+(?:[._-][a-zA-Z0-9]+)*$'
        description:
          type: string
          maxLength: 2000
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    AssetMetadata:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AppIdentifier:
      type: object
      properties:
        id:
          type: integer
        platform:
          $ref: '#/components/schemas/Platform'
        identifier:
          type: string
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        version_code:
          type: integer
          nullable: true
          description: Android only
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAppIdentifier:
      type: object
      required: [platform, identifier]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        identifier:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
          nullable: true
        version:
          type: string
          maxLength: 255
          nullable: true
        version_code:
          type: integer
          minimum: 1
          nullable: true
          description: Android only

    UpdateAppIdentifier:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        identifier:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
          nullable: true
        version:
          type: string
          maxLength: 255
          nullable: true
        version_code:
          type: integer
          minimum: 1
          nullable: true

    Credential:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/CredentialType'
        name:
          type: string
        tags:
          type: array
          items:
            type: string
          default: []
        payload:
          type: object
          nullable: true
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        app_identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AppIdentifier'
          description: Present when loaded
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/CredentialProfile'
