      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

    Conflict:
      description: Conflict (e.g. invalid build transition)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
