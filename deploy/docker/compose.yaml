name: app-manager

x-app: &app
  image: ${APP_MANAGER_IMAGE:-ghcr.io/karerckor/app-manager-platform:latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage-app:/var/www/html/storage/app
  depends_on:
    init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app_manager}
      POSTGRES_USER: ${DB_USERNAME:-app_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app_manager} -d ${DB_DATABASE:-app_manager}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: migrations and first-run provisioning happen exactly once, not in
  # each of the three long-running containers.
  init:
    image: ${APP_MANAGER_IMAGE:-ghcr.io/karerckor/app-manager-platform:latest}
    env_file: .env
    command: ["app-manager", "init"]
    restart: "no"
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "${APP_PORT:-8000}:8080"

  queue:
    <<: *app
    command: ["app-manager", "queue"]
    # The image's baked-in HEALTHCHECK curls the web server; queue doesn't run
    # one, so the check would never pass and `--wait` would hang forever.
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["app-manager", "scheduler"]
    # Same reasoning as queue: no web server in this role, so no HTTP healthcheck.
    healthcheck:
      disable: true

  # docker compose --profile tls up -d
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${APP_DOMAIN:-localhost}
      - --to
      - app:8080
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  storage-app:
  caddy-data:
  caddy-config:
