name: Platform CI

on:
  pull_request:
    paths:
      - apps/platform/**
      - .github/workflows/platform-ci.yml
  push:
    branches:
      - main
    paths:
      - apps/platform/**
      - .github/workflows/platform-ci.yml

concurrency:
  group: platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  js-lint:
    name: JS Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run design tests
        run: npm run test:design

      - name: Run design lint
        run: npm run design:lint

      - name: Build frontend
        run: npm run build

  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: [php-lint]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_manager_test
          POSTGRES_USER: app_manager
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/platform

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: composer test
