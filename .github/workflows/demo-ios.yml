name: Demo iOS · App Manager Fastlane

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: iOS build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      version_name:
        description: Version shown in the App Manager run snapshot
        required: true
        default: 1.0.0
        type: string
      simulate_failure:
        description: Finish the demo pipeline with a failure
        required: true
        default: false
        type: boolean
      app_manager_build_id:
        description: Build UUID injected by App Manager in manual reporting mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: demo-ios-${{ inputs.app_manager_build_id || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke-build:
    name: iOS ${{ inputs.configuration }} Fastlane demo
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      APP_MANAGER_API_KEY: ${{ secrets.APP_MANAGER_DEMO_API_KEY || 'demo-fastlane-api-key' }}
      APP_MANAGER_BASE_URL: ${{ secrets.APP_MANAGER_DEMO_BASE_URL || 'http://127.0.0.1:4567' }}
      APP_MANAGER_TEAM: ${{ vars.APP_MANAGER_DEMO_TEAM || 'demo-users-team' }}
      APP_MANAGER_APP: ${{ vars.APP_MANAGER_DEMO_APP || 'example-app' }}
      APP_MANAGER_BUILD_ID: ${{ inputs.app_manager_build_id }}
    defaults:
      run:
        working-directory: demos/expo-hello-world

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: demos/expo-hello-world/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane and the local App Manager plugin
        run: bundle install --jobs 4 --retry 3

      - name: Install demo dependencies
        run: npm ci --ignore-scripts

      - name: Start demo App Manager API
        if: ${{ env.APP_MANAGER_BASE_URL == 'http://127.0.0.1:4567' }}
        run: |
          node scripts/mock-app-manager-api.mjs > "${RUNNER_TEMP}/mock-app-manager.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mock-app-manager.pid"
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4567/health && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4567/health

      - name: Run demo preparation tests
        run: npm test

      - name: Run App Manager Fastlane demo build
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          VERSION_NAME: ${{ inputs.version_name }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: >-
          bundle exec fastlane plugin_demo
          platform:ios
          configuration:"${BUILD_CONFIGURATION}"
          version_name:"${VERSION_NAME}"
          simulate_failure:"${SIMULATE_FAILURE}"

      - name: Show App Manager API requests
        if: ${{ always() && env.APP_MANAGER_BASE_URL == 'http://127.0.0.1:4567' }}
        run: |
          cat "${RUNNER_TEMP}/mock-app-manager.log"
          if test -f "${RUNNER_TEMP}/mock-app-manager.pid"; then
            kill "$(cat "${RUNNER_TEMP}/mock-app-manager.pid")" || true
          fi
