name: Bug report
description: Report a reproducible App Manager problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or report vulnerabilities here. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, container tag, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Platform web application or API
        - Docker deployment
        - appmctl CLI
        - Fastlane plugin
        - Documentation
        - Demo application
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, credentials, customer data, and private URLs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed all secrets and private data from this report.
          required: true
